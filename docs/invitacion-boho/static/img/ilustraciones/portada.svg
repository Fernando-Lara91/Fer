    <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#92a8a4"/><stop offset="1" stop-color="#577e7b"/></linearGradient>
    <linearGradient id="terrain" x1="0" x2="1"><stop stop-color="#c88e78"/><stop offset="1" stop-color="#ad6e5f"/></linearGradient>
    <linearGradient id="foreground" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#75866d"/><stop offset="1" stop-color="#485b4b"/></linearGradient>
    <filter id="wash"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".17"/></feComponentTransfer></filter>
